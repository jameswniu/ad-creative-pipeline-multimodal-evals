<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img"
 aria-label="How do you craft evals? Split the question in three. Process evals: did every step run, and did its gate fire? Source of truth, the pipeline graph, fixed by the scripts. Outcome evals: is what shipped true to the facts? Source of truth, the research pass, re-derived per brief. Vibe evals: does it feel right to this audience? Source of truth, the golden set, re-derived per audience.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040914"/><stop offset="55%" stop-color="#081228"/><stop offset="100%" stop-color="#0b1c3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity=".38"/><stop offset="60%" stop-color="#1d4ed8" stop-opacity=".08"/><stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>
  <rect width="1200" height="460" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#38bdf8" opacity=".9"/>

  <text x="600" y="76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="50" font-weight="700" fill="#e0f2fe">How do you craft evals?</text>
  <text x="600" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#93c5fd">Split the question in three. Each tier answers to its own source of truth.</text>

  <rect x="40" y="150" width="360" height="242" rx="12" fill="#0b1c3d" fill-opacity=".55" stroke="#1e3a64"/>
  <rect x="40" y="150" width="7" height="242" rx="3.5" fill="#38bdf8"/>
  <text x="222" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#38bdf8">PROCESS EVALS</text>
  <text x="222" y="234" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e0f2fe">Did every step run,</text>
  <text x="222" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e0f2fe">and did its gate fire?</text>
  <text x="222" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="1.5" fill="#8fb4d8">SOURCE OF TRUTH</text>
  <text x="222" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e0f2fe">the pipeline graph</text>
  <text x="222" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#38bdf8">fixed by the scripts</text>

  <rect x="420" y="150" width="360" height="242" rx="12" fill="#0b1c3d" fill-opacity=".55" stroke="#1e3a64"/>
  <rect x="420" y="150" width="7" height="242" rx="3.5" fill="#8b8cf0"/>
  <text x="602" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#8b8cf0">OUTCOME EVALS</text>
  <text x="602" y="234" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e0f2fe">Is what shipped</text>
  <text x="602" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e0f2fe">true to the facts?</text>
  <text x="602" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="1.5" fill="#8fb4d8">SOURCE OF TRUTH</text>
  <text x="602" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e0f2fe">the research pass</text>
  <text x="602" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8b8cf0">re-derived per brief</text>

  <rect x="800" y="150" width="360" height="242" rx="12" fill="#0b1c3d" fill-opacity=".55" stroke="#1e3a64"/>
  <rect x="800" y="150" width="7" height="242" rx="3.5" fill="#f0b429"/>
  <text x="982" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#f0b429">VIBE EVALS</text>
  <text x="982" y="234" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e0f2fe">Does it feel right</text>
  <text x="982" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#e0f2fe">to this audience?</text>
  <text x="982" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="1.5" fill="#8fb4d8">SOURCE OF TRUTH</text>
  <text x="982" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#e0f2fe">the golden set</text>
  <text x="982" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#f0b429">re-derived per audience</text>

  <text x="600" y="432" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#7fb8e8">label   then   derive   then   gate   then   render   then   relabel</text>
</svg>
