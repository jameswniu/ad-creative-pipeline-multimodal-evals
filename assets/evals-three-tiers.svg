<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img"
 aria-label="How do you craft evals? Split the question in three. Process evals: did every step run, and did its gate fire? Source of truth, the pipeline graph, fixed by the scripts. Outcome evals: is what shipped true to the facts? Source of truth, the research pass, re-derived per brief. Vibe evals: does it feel right to this audience? Source of truth, the golden set, re-derived per audience.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede5d6"/><stop offset="55%" stop-color="#f2ece0"/><stop offset="100%" stop-color="#f7f2ea"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#cbbfa9" stop-opacity=".38"/><stop offset="60%" stop-color="#cbbfa9" stop-opacity=".08"/><stop offset="100%" stop-color="#cbbfa9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1a15" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>
  <rect width="1200" height="460" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="3" fill="#2f6b3f" opacity=".9"/>

  <text x="600" y="76" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="50" font-weight="700" fill="#1f1a15">How do you craft evals?</text>
  <text x="600" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="27" fill="#6f665c">Split the question in three. Each tier answers to its own source of truth.</text>

  <rect x="40" y="150" width="360" height="242" rx="12" fill="#fffdf9" fill-opacity=".75" stroke="#cbbfa9"/>
  <rect x="40" y="150" width="7" height="242" rx="3.5" fill="#2f6b3f"/>
  <text x="222" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#2f6b3f">PROCESS EVALS</text>
  <text x="222" y="234" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#1f1a15">Did every step run,</text>
  <text x="222" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#1f1a15">and did its gate fire?</text>
  <text x="222" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="1.5" fill="#6f665c">SOURCE OF TRUTH</text>
  <text x="222" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1f1a15">the pipeline graph</text>
  <text x="222" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#2f6b3f">fixed by the scripts</text>

  <rect x="420" y="150" width="360" height="242" rx="12" fill="#fffdf9" fill-opacity=".75" stroke="#cbbfa9"/>
  <rect x="420" y="150" width="7" height="242" rx="3.5" fill="#b8371f"/>
  <text x="602" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#b8371f">OUTCOME EVALS</text>
  <text x="602" y="234" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#1f1a15">Is what shipped</text>
  <text x="602" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#1f1a15">true to the facts?</text>
  <text x="602" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="1.5" fill="#6f665c">SOURCE OF TRUTH</text>
  <text x="602" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1f1a15">the research pass</text>
  <text x="602" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#b8371f">re-derived per brief</text>

  <rect x="800" y="150" width="360" height="242" rx="12" fill="#fffdf9" fill-opacity=".75" stroke="#cbbfa9"/>
  <rect x="800" y="150" width="7" height="242" rx="3.5" fill="#8c6210"/>
  <text x="982" y="192" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" font-weight="700" letter-spacing="2" fill="#8c6210">VIBE EVALS</text>
  <text x="982" y="234" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#1f1a15">Does it feel right</text>
  <text x="982" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" font-weight="700" fill="#1f1a15">to this audience?</text>
  <text x="982" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" letter-spacing="1.5" fill="#6f665c">SOURCE OF TRUTH</text>
  <text x="982" y="338" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#1f1a15">the golden set</text>
  <text x="982" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#8c6210">re-derived per audience</text>

  <text x="600" y="432" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#6f665c">label   then   derive   then   gate   then   render   then   relabel</text>
</svg>
